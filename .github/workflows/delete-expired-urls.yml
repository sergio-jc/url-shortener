name: Delete Expired URLs

on:
  schedule:
    - cron: '0 0 28 * *'
  workflow_dispatch:

jobs:
  delete-expired-urls:
    name: Delete Expired URLs
    runs-on: ubuntu-latest
    environment: Production

    steps:
      - name: Delete expired URLs
        run: |
          response=$(curl -s -w "\n%{http_code}" \
            -X DELETE \
            -H "Authorization: Bearer ${{ secrets.PRIVATE_API_KEY }}" \
            "${{ secrets.BETTER_AUTH_URL }}api/delete-expired-urls")

          body=$(echo "$response" | head -n -1)
          status=$(echo "$response" | tail -n 1)

          echo "Status: $status"
          echo "Body: $body"

          if [ "$status" != "200" ]; then
            echo "Request failed with status $status"
            exit 1
          fi
